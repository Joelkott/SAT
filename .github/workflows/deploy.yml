name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # Catch broken builds before they reach the server.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build backend
        working-directory: backend
        run: go build ./...

      - name: Test backend
        working-directory: backend
        run: go test ./...

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            # Preserve the server's real production env (tracked file, local values).
            cp .env.production /tmp/env.production.bak 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/env.production.bak .env.production 2>/dev/null || true
            # Backend + DB only — the frontend deploys via Vercel.
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build backend postgres
            docker image prune -f
            # Backend runs with host networking; probe it directly.
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8080/api/health >/dev/null 2>&1; then
                echo "backend healthy"; exit 0
              fi
              sleep 5
            done
            echo "backend failed to become healthy" >&2
            docker logs --tail 50 teleprompter-backend >&2
            exit 1
