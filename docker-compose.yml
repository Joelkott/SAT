services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: teleprompter-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teleprompter_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teleprompter_pass}
      POSTGRES_DB: ${POSTGRES_DB:-teleprompter}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    # Postgres is reachable from other containers via the compose network.
    # Not published to the host; use `docker exec teleprompter-db psql ...`
    # or temporarily add a ports mapping if a host DB tool is needed.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teleprompter_user} -d ${POSTGRES_DB:-teleprompter}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Go Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teleprompter-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-teleprompter_user}:${POSTGRES_PASSWORD:-teleprompter_pass}@postgres:5432/${POSTGRES_DB:-teleprompter}?sslmode=disable
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
      TYPESENSE_HOST: ${TYPESENSE_HOST}
      PORT: 8080
      BACKUP_DIR: /app/backups
      # ProPresenter Integration
      PROPRESENTER_ENABLED: ${PROPRESENTER_ENABLED:-false}
      PROPRESENTER_HOST: ${PROPRESENTER_HOST:-}
      PROPRESENTER_PORT: ${PROPRESENTER_PORT:-62683}
      PROPRESENTER_PLAYLIST: ${PROPRESENTER_PLAYLIST:-Live Queue}
      # Bible API Integration
      API_BIBLE_KEY: ${API_BIBLE_KEY:-}
      API_BIBLE_BASE_URL: ${API_BIBLE_BASE_URL:-https://rest.api.bible/v1}
      # Set TZ in .env so the daily 2 AM backup fires at 2 AM *local* time.
      TZ: ${TZ:-UTC}
      # Caption/AI Bible reference pipeline (optional)
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      JGM_CAPTIONS_URL: ${JGM_CAPTIONS_URL:-}
      BIBLE_PARSER_API_KEY: ${BIBLE_PARSER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma2:2b}
      ENABLE_CAPTION_PROCESSING: ${ENABLE_CAPTION_PROCESSING:-false}
      DISABLE_TYPESENSE: ${DISABLE_TYPESENSE:-false}
    volumes:
      # Host bind-mount so backups survive `docker-compose down -v` and are
      # reachable for offsite copying.
      - ./backend/backups:/app/backups
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - API_URL=${API_URL:-http://localhost:8080/api}
    container_name: teleprompter-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_URL: ${API_URL:-http://localhost:8080/api}
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:8080/api}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:

